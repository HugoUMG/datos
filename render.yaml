# Despliegue completo en Render (Blueprint): base de datos, backend y frontend.
# Render → New → Blueprint → elegir este repositorio. Las variables con "sync: false"
# (contraseñas iniciales) se piden al crear el Blueprint y no quedan en el repositorio.
databases:
  - name: activos-db
    plan: free
    databaseName: activosdb
    user: activos

services:
  - type: web
    name: activos-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase: { name: activos-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: activos-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: activos-db, property: database }
      - key: DB_USER
        fromDatabase: { name: activos-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: activos-db, property: password }
      - key: CORS_ALLOWED_ORIGINS
        value: https://activos-frontend-fvkn.onrender.com
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_COMPRAS_PASSWORD
        sync: false
      - key: SEED_INVENTARIO_PASSWORD
        sync: false
      - key: SEED_FINANZAS_PASSWORD
        sync: false

  - type: web
    name: activos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/frontend/browser
    routes:
      # El frontend llama a /api en su mismo dominio y Render lo reenvía al backend (sin CORS).
      # Si Render le asigna otro nombre al backend, actualiza esta URL.
      - type: rewrite
        source: /api/*
        destination: https://activos-backend-y6j4.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
