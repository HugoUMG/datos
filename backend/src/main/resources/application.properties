spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/activosdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# En producción conviene "validate" una vez que el esquema esté estable (riesgo R02 del SGC).
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
spring.jackson.serialization.fail-on-empty-beans=false

# Orígenes permitidos para CORS, separados por coma.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://datos-1-4rmw.onrender.com}

# Contraseñas de los usuarios iniciales: solo por variables de entorno, nunca en el repositorio.
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.compras-password=${SEED_COMPRAS_PASSWORD:}
app.seed.inventario-password=${SEED_INVENTARIO_PASSWORD:}
app.seed.finanzas-password=${SEED_FINANZAS_PASSWORD:}
