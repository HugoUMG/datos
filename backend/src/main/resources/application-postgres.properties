# Perfil para Render: base PostgreSQL administrada (se activa con SPRING_PROFILES_ACTIVE=postgres).
# Render entrega host, puerto, base, usuario y contraseña por separado; aquí se arma la URL JDBC.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Plan gratuito: pocas conexiones disponibles.
spring.datasource.hikari.maximum-pool-size=5
